        .priority-badge {
            display: inline-block;

            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;

        .priority-high {

        .priority-medium {

            background-color: #e0e7ff;

        }

        .type-common {

        .type-differentiator {

        }
        
        .type-partial {
            background-color: #fef3c7;
            border-left: 4px solid #eab308;
        }
        
        .stat-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .feature-row {
            transition: all 0.2s;
        }
        
        .feature-row:hover {
            background-color: #f9fafb;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .filter-chip {
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-chip:hover {
            transform: scale(1.05);
        }
        
        .filter-chip.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        
        .comparison-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        
        @media (max-width: 768px) {
            .comparison-section {
                grid-template-columns: 1fr;
            }
        }
        
        .scroll-shadow {
            position: relative;
            overflow-x: auto;
        }
        
        .scroll-shadow::before,
        .scroll-shadow::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 20px;
            pointer-events: none;
            z-index: 10;
        }
        
        .scroll-shadow::before {
            left: 0;
            background: linear-gradient(to right, white, transparent);
        }
        
        .scroll-shadow::after {
            right: 0;
            background: linear-gradient(to left, white, transparent);

                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="text-sm text-gray-600">
                                        Showing {filteredFeatures.length} of {FEATURE_DATA.length} features
                                    </div>
                                </div>
                            </div>

                            {/* Feature Cards */}
                            <div className="space-y-4">
                                {filteredFeatures.map((feature, index) => (
                                    <div 
                                        key={index}
                                        className={`feature-row bg-white rounded-xl shadow-md p-6 ${getTypeClass(feature['Common or Differentiator'])}`}
                                    >
                                        <div className="flex items-start justify-between mb-4">
                                            <div className="flex-1">
                                                <div className="flex items-center gap-3 mb-2">
                                                    <h3 className="text-lg font-bold text-gray-900">
                                                        {feature['Feature Name']}
                                                    </h3>
                                                    <span className="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-xs font-medium">
                                                        {feature['Feature Category']}
                                                    </span>
                                                </div>
                                                <div className="text-sm text-gray-600 mb-1">
                                                    {feature['User Type']}
                                                </div>
                                                <div className="text-sm font-medium text-gray-700">
                                                    {feature['Key Insights']}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            {/* B&M Column */}
                                            <div className="space-y-2">
                                                <div className="flex items-center justify-between">
                                                    <span className="text-sm font-semibold text-gray-700">Brick-and-Mortar</span>
                                                    <span className={getPriorityClass(feature['Brick-and-Mortar Priority'])}>
                                                        {feature['Brick-and-Mortar Priority']}
                                                    </span>
                                                </div>
                                                <div className="text-sm text-gray-600 p-3 bg-gray-50 rounded-lg">
                                                    {feature['Brick-and-Mortar Notes']}
                                                </div>
                                            </div>

                                            {/* Online Column */}
                                            <div className="space-y-2">
                                                <div className="flex items-center justify-between">
                                                    <span className="text-sm font-semibold text-gray-700">Online Influencer</span>
                                                    <span className={getPriorityClass(feature['Online Influencer Priority'])}>
                                                        {feature['Online Influencer Priority']}
                                                    </span>
                                                </div>
                                                <div className="text-sm text-gray-600 p-3 bg-gray-50 rounded-lg">
                                                    {feature['Online Influencer Notes']}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="mt-4 pt-4 border-t border-gray-200">
                                            <div className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">
                                                Performance Expectations
                                            </div>
                                            <div className="text-sm text-gray-700">
                                                {feature['Performance Expectations']}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {filteredFeatures.length === 0 && (
                                <div className="bg-white rounded-xl shadow-md p-12 text-center">
                                    <div className="text-gray-400 mb-4">
                                        <svg className="mx-auto h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                    </div>
                                    <h3 className="text-lg font-medium text-gray-900 mb-2">No features found</h3>
                                    <p className="text-gray-500">Try adjusting your filters or search term</p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-12 bg-white border-t border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                            <div className="text-center text-sm text-gray-600">
                                <p className="mb-2">
                                    <strong>Research Sources:</strong> Playbook, Trainerize, Everfit, PushPress, Wodify, TrainHeroic, FITTR
                                </p>
                                <p>
                                    Created for Daxko Product Strategy • {new Date().toLocaleDateString()}
                                </p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
